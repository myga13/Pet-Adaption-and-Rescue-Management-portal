# Fly.io deployment config
app = "petsapp"
primary_region = "iad"

[build]
image = "petsapp:latest"
dockerfile = "Dockerfile"

[env]
FLASK_ENV = "production"
SECRET_KEY = "your-secret-key-here"

[[services]]
internal_port = 5000
processes = ["app"]
protocol = "tcp"
[[services.ports]]
handlers = ["http"]
port = 80
[[services.ports]]
handlers = ["tls", "http"]
port = 443

[deploy]
wait_timeout = "300s"

[checks]
  [checks.alive]
    type = "http"
    interval = "10s"
    timeout = "5s"
    grace_period = "5s"
    method = "get"
    path = "/"
    protocol = "http"
