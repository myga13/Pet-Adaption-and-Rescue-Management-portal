{% extends "admin_base.html" %}
{% block title %}PawCare | Verify Admin OTP{% endblock %}
{% block content %}

<div style="max-width:400px; margin:60px auto; padding:24px; background:#ffffff;
            border-radius:16px; box-shadow:0 10px 28px rgba(15,23,42,0.12);">
  <h2 style="margin-bottom:8px;">Verify OTP</h2>
  <p style="font-size:13px; color:#6b7280; margin-bottom:16px;">
    We have sent a 6-digit OTP to your admin email
    <strong>{{ email }}</strong>. Enter it below to complete login.
  </p>

  <form action="{{ url_for('main.admin_verify_otp') }}" method="post">
    <div style="margin-bottom:12px;">
      <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">OTP</label>
      <input type="text" name="otp" maxlength="6" required
             style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid #d1d5db;
                    text-align:center; letter-spacing:4px;">
    </div>

    <button type="submit"
            style="width:100%; padding:9px 18px; border-radius:999px; border:none;
                   background:#16a34a; color:#ffffff; font-weight:700; cursor:pointer;">
      Verify &amp; Login
    </button>

    <p style="font-size:12px; color:#6b7280; margin-top:10px;">
      Didn’t get an OTP? Go back to <a href="{{ url_for('main.admin_login') }}" style="color:#2563eb;">Admin Login</a>.
    </p>
  </form>
</div>

{% endblock %}
