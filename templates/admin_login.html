{% extends "admin_base.html" %}
{% block title %}PawCare | Admin Login{% endblock %}
{% block content %}

<div style="max-width:400px; margin:60px auto; padding:24px; background:#ffffff;
            border-radius:16px; box-shadow:0 10px 28px rgba(15,23,42,0.12);">
  <h2 style="margin-bottom:8px;">Admin Login</h2>
  <p style="font-size:13px; color:#6b7280; margin-bottom:16px;">
    Login using your admin email and password. An OTP will be sent to your email for verification.
  </p>

  <form action="{{ url_for('main.admin_login') }}" method="post">
    <div style="margin-bottom:12px;">
      <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Email</label>
      <input type="email" name="email" required
             style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid #d1d5db;">
    </div>

    <div style="margin-bottom:12px;">
      <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Password</label>
      <input type="password" name="password" required
             style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid #d1d5db;">
    </div>

    <button type="submit"
            style="width:100%; padding:9px 18px; border-radius:999px; border:none;
                   background:#2563eb; color:#ffffff; font-weight:700; cursor:pointer;">
      Send OTP &amp; Continue
    </button>

    <p style="font-size:12px; color:#6b7280; margin-top:10px;">
      New admin? <a href="{{ url_for('main.admin_register') }}" style="color:#2563eb;">Register here</a>.
    </p>
  </form>
</div>

{% endblock %}
