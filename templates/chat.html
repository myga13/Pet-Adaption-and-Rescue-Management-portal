{% extends "base.html" %}
{% block title %}My Chats{% endblock %}
{% block content %}

<style>
.chat-wrap {
  display: flex;
  height: 90vh;
  border: 1px solid #ddd;
  border-radius: 6px;
  overflow: hidden;
}
.rooms {
  width: 30%;
  border-right: 1px solid #ddd;
  background: #f9fafb;
  overflow-y: auto;
}
.room {
  padding: 12px;
  cursor: pointer;
  border-bottom: 1px solid #eee;
}
.room:hover { background: #e5e7eb; }
.room.active {
  background: #dbeafe;
  font-weight: bold;
}

.chat {
  width: 70%;
  display: flex;
  flex-direction: column;
}
.chat-header {
  padding: 12px;
  border-bottom: 1px solid #ddd;
  font-weight: bold;
}
.chat-messages {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
  background: #fff;
}
.msg {
  margin-bottom: 12px;
}
.msg b {
  color: #1f2937;
}
.chat-input {
  display: flex;
  padding: 10px;
  border-top: 1px solid #ddd;
  background: #f3f4f6;
}
.chat-input input {
  flex: 1;
  padding: 8px;
}
.chat-input button {
  margin-left: 8px;
  padding: 8px 16px;
}
</style>

<div class="chat-wrap">

  <!-- LEFT: ROOMS -->
  <div class="rooms">
    <h3 style="padding:10px;">My Rooms</h3>

    {% for r in rooms %}
      <div class="room"
           id="room-{{ r.id }}"
           onclick="openRoom({{ r.id }}, '{{ r.name }}')">
        {{ r.name }}
      </div>
    {% else %}
      <p style="padding:10px;color:#777;">No active chats</p>
    {% endfor %}
  </div>

  <!-- RIGHT: CHAT -->
  <div class="chat">
    <div class="chat-header" id="chatHeader">
      Select a room
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input" id="chatInput" style="display:none;">
      <input id="msgInput" placeholder="Type your message...">
      <button onclick="send()">Send</button>
    </div>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io();
let ROOM_ID = null;
let LAST_TS = null;

/* OPEN ROOM (ONLY ON CLICK) */
function openRoom(id, name) {
  ROOM_ID = id;
  LAST_TS = null;

  document.querySelectorAll(".room")
    .forEach(r => r.classList.remove("active"));
  document.getElementById("room-" + id).classList.add("active");

  chatHeader.innerText = name;
  chatInput.style.display = "flex";

  socket.emit("join_room", { room_id: id });

  loadMessages(true);   // full load once
}

/* SEND MESSAGE */
function send() {
  const text = msgInput.value.trim();
  if (!text || !ROOM_ID) return;

  fetch("/rooms/send", {
    method: "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      room_id: ROOM_ID,
      content: text
    })
  });

  msgInput.value = "";
}

/* REAL-TIME SOCKET */
socket.on("new_room_message", d => {
  if (d.room_id === ROOM_ID) {
    loadMessages(false);   // append only
  }
});

/* LOAD / REFRESH MESSAGES */
function loadMessages(reset=false) {
  fetch(`/api/rooms/${ROOM_ID}`, { credentials: "same-origin" })
    .then(r => r.json())
    .then(d => {

      if (reset) chatMessages.innerHTML = "";

      d.messages.forEach(m => {
        if (!LAST_TS || m.created_at > LAST_TS) {
          render(m);
          LAST_TS = m.created_at;
        }
      });

      chatMessages.scrollTop = chatMessages.scrollHeight;
    });
}

/* AUTO REFRESH (FAILSAFE) */
setInterval(() => {
  if (ROOM_ID) loadMessages(false);
}, 3000);

/* RENDER MESSAGE */
function render(m) {
  const div = document.createElement("div");
  div.className = "msg " + m.sender_role;
  div.innerHTML = `
    <b>${m.sender_name}</b><br>
    ${m.content}
  `;
  chatMessages.appendChild(div);
}
</script>


{% endblock %}
