{% extends "admin_base.html" %}
{% block title %}Admin Chat{% endblock %}
{% block content %}

<style>
:root {
  --border:#ddd;
  --bg-light:#f9fafb;
  --bg-hover:#e5e7eb;
  --bg-active:#dbeafe;
  --admin:#1d4ed8;
  --user:#047857;
}

.chat-wrapper {
  display:flex;
  height:90vh;
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
}

/* ---------- SIDEBAR ---------- */
.sidebar {
  width:30%;
  background:var(--bg-light);
  border-right:1px solid var(--border);
  padding:12px;
  overflow-y:auto;
}

.room-item {
  padding:10px;
  margin-bottom:6px;
  border-radius:6px;
  cursor:pointer;
}
.room-item:hover { background:var(--bg-hover); }
.room-item.active { background:var(--bg-active); font-weight:bold; }
.room-item.closed { opacity:.6; }

/* ---------- CHAT ---------- */
.chat-panel {
  width:70%;
  display:flex;
  flex-direction:column;
}

.chat-header {
  padding:12px;
  border-bottom:1px solid var(--border);
  font-weight:bold;
}

.chat-messages {
  flex:1;
  padding:12px;
  overflow-y:auto;
}

.msg { margin-bottom:12px; }
.msg.admin b { color:var(--admin); }
.msg.user b { color:var(--user); }

.chat-input {
  display:none;
  gap:8px;
  padding:10px;
  border-top:1px solid var(--border);
  background:#f3f4f6;
}
.chat-input input {
  flex:1;
  padding:8px;
}

/* ---------- MODAL ---------- */
.modal-backdrop {
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.4);
}

.modal {
  width:420px;
  background:#fff;
  padding:20px;
  border-radius:6px;
}
</style>

<div class="chat-wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h3>Rooms</h3>
    {% for r in rooms %}
      <div class="room-item {% if r.is_closed %}closed{% endif %}"
           id="room-{{ r.id }}"
           onclick="openRoom({{ r.id }}, '{{ r.name }}', {{ r.is_closed|int }})">
        {{ r.name }} {% if r.is_closed %}(closed){% endif %}
      </div>
    {% endfor %}
    <button style="width:100%;margin-top:10px" onclick="openModal()">➕ Create Room</button>
  </aside>

  <!-- CHAT -->
  <section class="chat-panel">
    <div class="chat-header" id="chatHeader">Select a room</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input" id="chatInput">
      <input id="msgInput" placeholder="Type message…"
             onkeydown="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
  </section>
</div>

<!-- CREATE ROOM MODAL -->
<div class="modal-backdrop" id="roomModal">
  <div class="modal">
    <h3>Create Room</h3>
    <input id="roomName" placeholder="Room name" style="width:100%;padding:8px">

    <div style="max-height:200px;overflow:auto;margin:10px 0">
      {% for u in users %}
        <label>
          <input type="checkbox" value="{{ u.user_id }}"> {{ u.user_name }}
        </label><br>
      {% endfor %}
    </div>

    <div style="text-align:right">
      <button onclick="closeModal()">Cancel</button>
      <button onclick="createRoom()">Create</button>
    </div>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io({ transports:["websocket"] });

let currentRoomId = null;

/* ---------- MODAL ---------- */
const roomModal = document.getElementById("roomModal");
function openModal(){ roomModal.style.display = "flex"; }
function closeModal(){ roomModal.style.display = "none"; }

/* ---------- OPEN ROOM ---------- */
function openRoom(id, name, closed){
  if (currentRoomId) {
    socket.emit("leave_room", { room_id: currentRoomId });
  }

  currentRoomId = id;

  document.querySelectorAll(".room-item").forEach(r => r.classList.remove("active"));
  document.getElementById(`room-${id}`).classList.add("active");

  chatHeader.textContent = name;
  chatMessages.innerHTML = "";
  chatInput.style.display = closed ? "none" : "flex";

  socket.emit("join_room", { room_id: id });
  loadMessages();
}

/* ---------- LOAD MESSAGES ---------- */
function loadMessages(){
  fetch(`/api/rooms/${currentRoomId}`, { credentials:"same-origin" })
    .then(r => r.json())
    .then(d => {
      chatMessages.innerHTML = "";
      (d.messages || []).forEach(renderMessage);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    })
    .catch(err => console.error("Load messages failed:", err));
}

/* ---------- SEND MESSAGE ---------- */
function sendMessage(){
  const text = msgInput.value.trim();
  if (!text || !currentRoomId) return;

  fetch("/rooms/send", {
  method:"POST",
  credentials:"same-origin",
  headers:{ "Content-Type":"application/json" },
  body:JSON.stringify({ room_id: currentRoomId, content: text })
});


  msgInput.value = "";
}

/* ---------- RENDER MESSAGE ---------- */
function renderMessage(m){
  const div = document.createElement("div");
  div.className = `msg ${m.sender_role || "user"}`;

  const name = document.createElement("b");
  name.textContent = m.sender_name || "Unknown";

  div.appendChild(name);
  div.appendChild(document.createElement("br"));
  div.appendChild(document.createTextNode(m.content || ""));

  chatMessages.appendChild(div);
}

/* ---------- SOCKET EVENTS ---------- */
socket.on("new_room_message", data => {
  if (data.room_id === currentRoomId && data.message) {
    renderMessage(data.message);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
});

/* ---------- CREATE ROOM ---------- */
function createRoom(){
  const name = document.getElementById("roomName").value.trim();
  const users = [...document.querySelectorAll("#roomModal input:checked")]
                .map(i => i.value);

  if (!name) {
    alert("Room name required");
    return;
  }

  fetch("/rooms/create", {   // ⚠️ CHANGE THIS AFTER STEP 1
    method: "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, users })
  })
  .then(r => {
    if (!r.ok) throw new Error("Create failed");
    return r.json();
  })
  .then(() => location.reload())
  .catch(() => alert("Room creation failed"));
}


</script>

{% endblock %}
